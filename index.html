
<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>خایه‌کن 💛</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090909;color:#eee;font:15px Tahoma;max-width:1000px;padding:15px;margin:auto}
h1,h2{color:#ffd447}
h1{font-size:28px}
small,.muted{color:#999}
.box{background:#171717;border:1px solid #333;border-radius:16px;padding:16px;margin:12px 0}
input,textarea{background:#090909;color:white;border:1px solid #444;border-radius:10px;padding:12px;font:inherit;width:100%;margin:5px 0}
textarea{min-height:90px}
button{border:0;border-radius:10px;padding:10px 13px;margin:4px;background:#ffd447;color:#171300;font-weight:bold;cursor:pointer}
button.dark{background:#292929;color:#eee;border:1px solid #444}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row input{flex:1;min-width:150px}
.post{white-space:pre-wrap;line-height:1.9;margin:14px 0}
.reactions{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.reactions button{background:#292929;color:#eee;font-size:12px}
.reactions button.active{background:#51420d;color:#ffd447;border:1px solid #ffd447}
.count{display:block;font-size:18px}
.note{color:#aaa;font-size:13px}
.award{color:#ffd447}
.hidden{display:none}
@media(max-width:600px){.reactions{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

<h1>خایه‌کن 💛</h1>
<small>اینجا خایه‌کردن هنر است.</small>

<div class="box">
<h2>🔐 ورود / ثبت‌نام</h2>

<div id="forms">
<div class="row">
<input id="email" type="email" placeholder="ایمیل">
<input id="pass" type="password" placeholder="رمز (حداقل ۶ حرف)">
</div>
<input id="uname" placeholder="نام کاربری (برای ثبت‌نام)">
<button onclick="signup()">ثبت‌نام</button>
<button onclick="login()">ورود</button>
</div>

<div id="logged" class="hidden">
<b id="who"></b>
<button onclick="logout()">خروج</button>
</div>
<p id="authmsg" class="note"></p>
</div>

<div class="box">
<h2>✍️ خایه‌ات را ثبت کن</h2>
<textarea id="txt" maxlength="1200" placeholder="چه شاهکاری خلق کردی؟"></textarea>
<button onclick="post()">انتشار خایه 🚀</button>
<span id="postmsg" class="note"></span>
</div>

<div class="box">
<h2>🏆 افتخارات</h2>
<div class="award">👑 اسطوره‌ی امروز: <span id="day">—</span></div>
<div class="award">🌌 ابر شاهکار هفته: <span id="week">—</span></div>
</div>

<h2>🔥 خایه‌های تازه <button class="dark" onclick="feed()">↻</button></h2>
<div id="posts">در حال بارگذاری…</div>

<p class="note">خایه‌کن © محفل رسمی خایه‌کردن‌های بی‌هدف</p>

<script>
const db=supabase.createClient(
'https://vacnrlqappkdzzjozlux.supabase.co',
'sb_publishable_hV8tUiRF5BcUtCf0rt-5Uw_xJNLUBqN'
);

let user=null,profile=null,posts=[],reactions=[],names={};

const labels=[
'',
'یه بار خایه کردم',
'دوبار خایه کردم',
'سه بار خایه کردم',
'چهار بار خایه کردم'
];

const $=x=>document.getElementById(x);

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({
'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c])),

num=n=>Number(n||0).toLocaleString('fa-IR');

async function authUI(){
let {data:{session}}=await db.auth.getSession();
user=session?.user||null;

if(user){
let {data:p}=await db.from('profiles')
.select('*').eq('id',user.id).maybeSingle();

if(!p){
let un=(user.user_metadata?.username||user.email.split('@')[0]).slice(0,24);
let r=await db.from('profiles')
.insert({id:user.id,username:un}).select().single();
p=r.data;
}

profile=p;
$('forms').classList.add('hidden');
$('logged').classList.remove('hidden');
$('who').textContent='سلام '+(p?.username||user.email);

}else{
$('forms').classList.remove('hidden');
$('logged').classList.add('hidden');
}
}

async function signup(){
let email=$('email').value.trim(),
password=$('pass').value,
username=$('uname').value.trim();

if(!email||password.length<6||!username)
return $('authmsg').textContent='همه فیلدها را کامل کن.';

let {data,error}=await db.auth.signUp({
email,password,
options:{data:{username}}
});

$('authmsg').textContent=error?.message||
(data.session?'ثبت‌نام شد!':'ثبت‌نام شد؛ ایمیل تأیید را باز کن، بعد وارد شو.');

await authUI();
await feed();
}

async function login(){
let {data,error}=await db.auth.signInWithPassword({
email:$('email').value.trim(),
password:$('pass').value
});

$('authmsg').textContent=error?.message||'ورود موفق!';
await authUI();
await feed();
}

async function logout(){
await db.auth.signOut();
await authUI();
await feed();
}

async function post(){
if(!user)return $('postmsg').textContent='اول وارد شو.';

let content=$('txt').value.trim();

if(!content)return $('postmsg').textContent='متن خایه خالیه!';

let {error}=await db.from('posts').insert({
user_id:user.id,content
});

$('postmsg').textContent=error?.message||'منتشر شد!';

if(!error){
$('txt').value='';
await feed();
}
}

async function vote(pid,t){
if(!user)return alert('برای خایه‌کردن وارد شو!');

let old=reactions.find(r=>r.post_id===pid&&r.user_id===user.id);

let res=old?.reaction_type===t
?await db.from('reactions').delete().eq('id',old.id)
:await db.from('reactions').upsert({
post_id:pid,user_id:user.id,reaction_type:t
},{onConflict:'post_id,user_id'});

if(res.error)alert(res.error.message);
await feed();
}

async function feed(){

let [a,b,c]=await Promise.all([
db.from('posts').select('id,user_id,content,created_at')
.order('created_at',{ascending:false}).limit(100),

db.from('reactions')
.select('id,post_id,user_id,reaction_type,created_at'),

db.from('profiles').select('id,username')
]);

if(a.error||b.error||c.error){
$('posts').innerHTML='<div class="box">خطای اتصال: '+
esc(a.error?.message||b.error?.message||c.error?.message)+'</div>';
return;
}

posts=a.data||[];
reactions=b.data||[];
names=Object.fromEntries(c.data.map(x=>[x.id,x.username]));

let day=Date.now()-864e5,
week=Date.now()-7*864e5;

function rank(s){
let m={};

reactions.forEach(r=>{
let p=posts.find(x=>x.id===r.post_id);

if(p&&new Date(p.created_at).getTime()>s)
m[p.user_id]=(m[p.user_id]||0)+1;
});

return Object.entries(m).sort((x,y)=>y[1]-x[1])[0];
}

let d=rank(day),w=rank(week);

$('day').textContent=d?
(names[d[0]]||'عضو')+' · '+num(d[1])+' رأی':
'هنوز کسی خایه نکرده';

$('week').textContent=w?
(names[w[0]]||'عضو')+' · '+num(w[1])+' رأی':
'هنوز شاهکاری ثبت نشده';

if(!posts.length){
$('posts').innerHTML='<div class="box">محفل هنوز خالیه 👀<br>اولین خایه را ثبت کن!</div>';
return;
}

$('posts').innerHTML=posts.map(p=>{
let rs=reactions.filter(r=>r.post_id===p.id),
mine=rs.find(r=>r.user_id===user?.id);

return `<div class="box">
<b>${esc(names[p.user_id]||'عضو محفل')}</b>
<small>${new Date(p.created_at).toLocaleString('fa-IR')}</small>
<div class="post">${esc(p.content)}</div>
<div class="reactions">
${[1,2,3,4].map(t=>`
<button class="${mine?.reaction_type===t?'active':''}"
onclick="vote(${p.id},${t})">
<span class="count">${num(rs.filter(r=>r.reaction_type===t).length)}</span>
${labels[t]}
</button>`).join('')}
</div>
<p class="note">${num(rs.length)} خایه</p>
</div>`;
}).join('');
}

db.auth.onAuthStateChange(()=>{
setTimeout(async()=>{
await authUI();
await feed();
},0);
});

(async()=>{
await authUI();
await feed();
})();
</script>
</body>
</html>
